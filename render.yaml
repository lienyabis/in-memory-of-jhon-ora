services:
  # Single web service: builds React frontend, serves it from Express,
  # plus API + uploads + anniversary cron. Needs a Starter plan (or
  # higher) for the persistent disk below.
  - type: web
    name: jhon-ora-memorial
    runtime: node
    plan: starter
    rootDir: memorial-website/server
    buildCommand: npm install && npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: jhon-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: DATA_DIR
        value: /var/data
      - key: DISABLE_CRON
        value: '0'
      # Set these in Render dashboard (do NOT commit secrets):
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false # e.g. https://jhon-ora-memorial.onrender.com
      - key: CLIENT_URL
        sync: false # same as SITE_URL
      - key: DEATH_MONTH
        value: '10'
      - key: DEATH_DAY
        value: '7'
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
