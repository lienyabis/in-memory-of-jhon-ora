services:
  # Frontend only: React SPA built to static files, served free on Render.
  # Backend is pure PHP + MySQL hosted on InfinityFree (see backend/ + README).
  - type: web
    name: jhon-ora-memorial
    runtime: static
    plan: free
    rootDir: memorial-website/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA fallback so /memories /login /dashboard refresh works:
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this in Render dashboard (do NOT commit):
      # e.g. https://your-backend.infinityfreeapp.com
      - key: VITE_API_URL
        sync: false

