services:
  # Frontend only: React SPA built to static files, served free on Render.
  # Backend is pure PHP + MySQL hosted on InfinityFree (see backend/ + README).
  # NOTE: static sites must NOT have a `plan` field — Render rejects
  # `plan: free` on web services with "no such plan free for service type web".
  # (Static sites are always free; omit plan entirely.)
  - type: web
    name: in-memory-of-jhon-ora
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA fallback so /memories /login /dashboard refresh works:
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this in Render dashboard (do NOT commit):
      # e.g. https://your-backend.infinityfreeapp.com
      - key: VITE_API_URL
        sync: false

