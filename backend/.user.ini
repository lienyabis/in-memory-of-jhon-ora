; John Paul Ora Memorial — PHP upload limits (local dev + any host that
; reads per-directory .user.ini: InfinityFree, cPanel, php -S).
; UPLOAD_MAX_MB = 8 (batch TOTAL). Allow headroom for multipart overhead:
; per-file 16M, whole POST 56M (6 files + fields), 300s timeout.
upload_max_filesize = 16M
post_max_size = 56M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
